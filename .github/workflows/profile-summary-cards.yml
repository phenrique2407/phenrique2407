# Salve este arquivo em: .github/workflows/profile-summary-cards.yml
# (no repositório phenrique2407/phenrique2407)
name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"   # roda todo dia à meia-noite (UTC)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

permissions:
  contents: write          # necessário para salvar as imagens geradas no repositório

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release/v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
