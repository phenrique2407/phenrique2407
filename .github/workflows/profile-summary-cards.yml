# Salve este arquivo em: .github/workflows/profile-summary-cards.yml
# (no repositório phenrique2407/phenrique2407)
name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"   # roda todo dia à meia-noite (UTC)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write      # necessário para salvar as imagens geradas no repositório
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: -3   # horário de Brasília (usado no card de horário de produtividade)
